name: Daily News Report

on:
  schedule:
    # 每天北京时间 07:30 运行
    - cron: '30 7 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      resend:
        description: 重新推送（忽略 sent_ids 去重，不更新去重文件）
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Restore sent article ids
        uses: actions/cache@v4
        with:
          path: sent_ids.txt
          key: daily-report-sent-ids-${{ github.repository }}

      - name: Run daily report
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python daily_report.py ${{ github.event_name == 'workflow_dispatch' && inputs.resend && '--resend' || '' }}
